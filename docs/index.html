<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oficina Tech — Victoria</title>
    <meta name="description" content="Mini oficina 3D interactiva (Three.js) para el perfil de GitHub de Victoria." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="hud" role="region" aria-label="Controles e información">
      <div class="hud__title">Oficina Tech</div>
      <div class="hud__subtitle">Arrastra para girar · rueda para zoom · click en pantallas</div>

      <div class="hud__links">
        <a class="hud__btn" href="https://github.com/vickysape" target="_blank" rel="noreferrer">GitHub</a>
        <a class="hud__btn hud__btn--ghost" href="../README.md" target="_blank" rel="noreferrer">Volver al README</a>
      </div>

      <div class="hud__hint">
        Tip: las pantallas abren enlaces (puedes cambiarlos en <code>docs/main.js</code>).
      </div>
    </div>

    <canvas id="c"></canvas>

    <div class="footer" aria-hidden="true">
      Hecho con Three.js · Look tech (neón suave)
    </div>

    <script>
      // Si el módulo no llega a arrancar, mostramos un aviso visible.
      // Esto ayuda cuando `type="module"` falla al cargar (MIME/CORS/bloqueo) y no hay escena.
      window.__OFFICETECH_BOOTED__ = false;
      window.addEventListener("error", () => {
        // dejamos que el watchdog pinte el aviso (evita duplicados)
      });
      setTimeout(() => {
        if (window.__OFFICETECH_BOOTED__) return;
        const el = document.createElement("div");
        el.style.position = "fixed";
        el.style.left = "16px";
        el.style.right = "16px";
        el.style.bottom = "16px";
        el.style.zIndex = "9999";
        el.style.padding = "12px 12px";
        el.style.borderRadius = "14px";
        el.style.border = "1px solid rgba(255,255,255,.15)";
        el.style.background = "rgba(10, 12, 18, .78)";
        el.style.backdropFilter = "blur(10px)";
        el.style.color = "rgba(240,245,255,.92)";
        el.style.fontSize = "12px";
        el.innerHTML =
          "<b>La escena 3D no ha arrancado.</b><br/>" +
          "Suele significar que <code>main.js</code> no se cargó o falló al iniciar.<br/>" +
          "Abre la consola (F12) → <b>Console</b> y mira si hay un error de módulo/CORS/MIME.";
        document.body.appendChild(el);
      }, 1800);
    </script>

    <script type="module" src="./main.js"></script>
  </body>
</html>
