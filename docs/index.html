<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oficina Tech — Victoria</title>
    <meta name="description" content="Mini oficina 3D interactiva (Three.js) para el perfil de GitHub de Victoria." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="hud" role="region" aria-label="Controles e información">

      <div class="hud__links">

    <canvas id="c"></canvas>

    <div class="footer" aria-hidden="true">
